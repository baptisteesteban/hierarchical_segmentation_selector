[project]
name = "hierarchical_segmentation_selector"
version = "0.2.0"
authors = [
    {name = "Baptiste Esteban", email = "baptiste.esteban@epita.fr"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "dash>=4.4.1",
    "dash-bootstrap-components>=2.0.4",
    "gunicorn[prod]>=26.2.0",
    "imageio>=2.37.4",
    "loguru>=0.7.3",
    "numba>=0.67.0",
    "scikit-image>=0.26.0",
]

[project.optional-dependencies]
doc = [
    "mkdocs>=1.6.1",
    "mkdocs-mermaid2-plugin>=1.2.3",
    "mkdocs-material>=9.7.7",
]
prod = [
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "dash[testing]>=4.4.1",
    "pytest>=8.4.2",
    "ruff==0.15.14",
    "ty==0.0.38"
]

[tool.pytest.ini_options]
addopts = "-ra"
markers = [
    "dash_e2e: browser-based dash.integration tests (requires --run-dash-e2e)",
]
